services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pikko
      POSTGRES_PASSWORD: pikko
      POSTGRES_DB: pikko
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikko -d pikko"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pikko

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://pikko:pikko@postgres:5432/pikko?sslmode=disable
      MIGRATIONS_PATH: file:///database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pikko

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      APP_BASE_DOMAIN: pikko.site
      MARKETING_URL: https://pikko.site
      DASHBOARD_URL: https://app.pikko.site
      STOREFRONT_URL: https://shop.pikko.site
      API_BASE_URL: https://api.pikko.site
      DATABASE_URL: postgres://pikko:pikko@postgres:5432/pikko?sslmode=disable
      EMAIL_MODE: ${EMAIL_MODE:-log}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM_NAME: Pikko
      EMAIL_ACCOUNT_FROM: account@pikko.site
      EMAIL_NOTIFICATION_FROM: notifications@pikko.site
      EMAIL_REPLY_TO: support@pikko.site
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: lax
      API_ADDR: ":8080"
      API_CORS_ORIGINS: https://app.pikko.site,https://pikko.site,https://shop.pikko.site
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - api_storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pikko
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_MARKETING_URL: https://pikko.site
        NEXT_PUBLIC_DASHBOARD_URL: https://app.pikko.site
        NEXT_PUBLIC_STOREFRONT_URL: https://shop.pikko.site
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production
      API_BASE_URL: http://api:8080
      AUTH_COOKIE_NAME: pikko_session
    depends_on:
      - api
    networks:
      - pikko
    expose:
      - "3000"

  # Optional reverse proxy example (enable when deploying on the VPS).
  # Traefik/Caddy/nginx can sit in front; this nginx sample routes hostnames.
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks:
      - pikko

networks:
  pikko:

volumes:
  postgres_data:
  api_storage:
