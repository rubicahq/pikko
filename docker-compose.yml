services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pikko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pikko}
      POSTGRES_DB: ${POSTGRES_DB:-pikko}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pikko

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pikko}:${POSTGRES_PASSWORD:-pikko}@pikko-postgres:5432/${POSTGRES_DB:-pikko}?sslmode=disable
      MIGRATIONS_PATH: file:///database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pikko

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-pikko.site}
      LEGACY_BASE_DOMAIN: ${LEGACY_BASE_DOMAIN:-}
      APP_URL: ${APP_URL:-}
      MARKETING_URL: ${MARKETING_URL:-https://pikko.site}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://app.pikko.site}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://shop.pikko.site}
      API_BASE_URL: ${API_BASE_URL:-https://api.pikko.site}
      DATABASE_URL: postgres://${POSTGRES_USER:-pikko}:${POSTGRES_PASSWORD:-pikko}@pikko-postgres:5432/${POSTGRES_DB:-pikko}?sslmode=disable
      EMAIL_MODE: ${EMAIL_MODE:-log}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Pikko}
      EMAIL_ACCOUNT_FROM: ${EMAIL_ACCOUNT_FROM:-account@pikko.site}
      EMAIL_NOTIFICATION_FROM: ${EMAIL_NOTIFICATION_FROM:-notifications@pikko.site}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-support@pikko.site}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pikko_session}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_REDIRECT_ALLOWLIST: ${AUTH_REDIRECT_ALLOWLIST:-localhost,127.0.0.1,pikko.site}
      API_ADDR: ":8080"
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://app.pikko.site,https://pikko.site,https://shop.pikko.site}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/storage
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gemini/gemini-3.5-flash}
      IMPORT_MAX_PAGES: ${IMPORT_MAX_PAGES:-50}
      IMPORT_MAX_ITEMS: ${IMPORT_MAX_ITEMS:-500}
    volumes:
      - api_storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pikko
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_APP_BASE_DOMAIN: ${NEXT_PUBLIC_APP_BASE_DOMAIN:-pikko.site}
        NEXT_PUBLIC_LEGACY_BASE_DOMAIN: ${NEXT_PUBLIC_LEGACY_BASE_DOMAIN:-}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL:-https://pikko.site}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://app.pikko.site}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://shop.pikko.site}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
      API_BASE_URL: http://api:8080
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pikko_session}
    depends_on:
      - api
    networks:
      - pikko
    expose:
      - "3000"

  # Optional reverse proxy (enable with --profile proxy).
  # On the Emplicon VPS, use docker-compose.deploy.yml so this binds :9090
  # instead of conflicting with emplicon-nginx on :80/:443.
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Host port is defined in docker-compose.deploy.yml (VPS: 9090)
    # or a local override — never bind :80 on the Emplicon VPS.
    depends_on:
      - web
      - api
    networks:
      - pikko

networks:
  pikko:

volumes:
  postgres_data:
  api_storage:
