# Production deploy for rubicahq/pikko via SSH to the VPS.
#
# Default path is dry-run (SSH connectivity + HEAD SHA only).
# Real deploy requires workflow_dispatch with confirm_deploy=true and
# GitHub Environment "production" approval (configure required reviewers).
#
# Single source of truth for git pull: scripts/deploy.sh (DO_PULL=1 by default).
# Do NOT pass --no-pull unless Actions has already updated the checkout on the VPS.
#
# Secrets (Environment "production"):
#   DEPLOY_SSH_PRIVATE_KEY, DEPLOY_SSH_KNOWN_HOSTS,
#   DEPLOY_SSH_HOST, DEPLOY_SSH_PORT, DEPLOY_SSH_USER
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref for deploy.sh to check out on the VPS (default main)"
        required: false
        default: "main"
        type: string
      dry_run:
        description: "Run connectivity dry-run only (no deploy.sh). Ignored when confirm_deploy=true."
        required: false
        default: true
        type: boolean
      confirm_deploy:
        description: "Set true to run production deploy.sh --public-smoke after dry-run"
        required: false
        default: false
        type: boolean

# Dispatch-first: no push/main auto-deploy. Codex Cloud / operators trigger explicitly.
# Optional later: add a gated push job behind Environment protection if desired.

concurrency:
  group: pikko-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPROVED_REPO: rubicahq/pikko
  REMOTE_CHECKOUT: ~/pikko

jobs:
  guard:
    name: Repo and ref guard
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.normalize.outputs.deploy_ref }}
      run_deploy: ${{ steps.normalize.outputs.run_deploy }}
    steps:
      - name: Restrict to approved repository
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "${APPROVED_REPO}" ]]; then
            echo "::error::Refusing deploy workflow outside ${APPROVED_REPO} (got ${GITHUB_REPOSITORY})"
            exit 1
          fi
          echo "Repository OK: ${GITHUB_REPOSITORY}"

      - name: Normalize inputs
        id: normalize
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-main}"
          # Allow only simple refs (branch/tag/SHA-ish); reject path tricks.
          if [[ ${#REF} -gt 128 || ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ || "$REF" == *"//"* || "$REF" == */ || "$REF" == *".."* ]]; then
            echo "::error::Invalid ref: ${REF}"
            exit 1
          fi
          if [[ "$REF" == *".."* ]]; then
            echo "::error::Ref must not contain .."
            exit 1
          fi
          RUN_DEPLOY=false
          if [[ "${INPUT_CONFIRM_DEPLOY}" == "true" ]]; then
            RUN_DEPLOY=true
          fi
          echo "deploy_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "run_deploy=${RUN_DEPLOY}" >> "$GITHUB_OUTPUT"
          {
            echo "## Guard"
            echo ""
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Deploy ref: \`${REF}\`"
            echo "- confirm_deploy: \`${{ inputs.confirm_deploy }}\`"
            echo "- Will run production deploy job: \`${RUN_DEPLOY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Dry-run connectivity
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify deploy secrets present (no values printed)
        id: secrets
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_SSH_HOST DEPLOY_SSH_PORT DEPLOY_SSH_USER; do
            # Indirect expansion; never echo the value.
            val="${!name-}"
            if [[ -z "${val}" ]]; then
              echo "::error::Missing secret or variable: ${name}"
              missing=1
            else
              echo "OK: ${name} is set (length ${#val})"
            fi
          done
          if (( missing )); then
            {
              echo "## Dry-run: secrets missing"
              echo ""
              echo "One or more Environment secrets are unset. Configure them under"
              echo "**Settings → Environments → production → Environment secrets**."
              echo "See \`docs/codex-cloud-deploy.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Dry-run: secrets"
            echo ""
            echo "All required deploy secrets are present (values not printed)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SSH connectivity — hostname + checkout HEAD
        id: ssh
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH=(ssh
            -i ~/.ssh/deploy_key
            -p "$DEPLOY_SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          )

          # Connectivity only — do NOT run deploy.sh here.
          REMOTE_OUT="$("${SSH[@]}" 'set -euo pipefail; hostname; git -C ~/pikko rev-parse HEAD; git -C ~/pikko rev-parse --abbrev-ref HEAD')"
          echo "$REMOTE_OUT"
          HOSTNAME_LINE="$(printf '%s\n' "$REMOTE_OUT" | sed -n '1p')"
          HEAD_SHA="$(printf '%s\n' "$REMOTE_OUT" | sed -n '2p')"
          HEAD_REF="$(printf '%s\n' "$REMOTE_OUT" | sed -n '3p')"

          echo "remote_hostname=${HOSTNAME_LINE}" >> "$GITHUB_OUTPUT"
          echo "remote_head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "remote_branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"

          {
            echo "## Dry-run: SSH OK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Host | \`${DEPLOY_SSH_HOST}\` |"
            echo "| Port | \`${DEPLOY_SSH_PORT}\` |"
            echo "| User | \`${DEPLOY_SSH_USER}\` |"
            echo "| Remote hostname | \`${HOSTNAME_LINE}\` |"
            echo "| \`~/pikko\` HEAD | \`${HEAD_SHA}\` |"
            echo "| \`~/pikko\` branch | \`${HEAD_REF}\` |"
            echo ""
            echo "No \`deploy.sh\` was executed."
          } >> "$GITHUB_STEP_SUMMARY"

          # Scrub key material from the runner filesystem.
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key

  deploy:
    name: Deploy production
    needs: [guard, dry-run]
    if: needs.guard.outputs.run_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and run deploy.sh --public-smoke
        id: deploy
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REF: ${{ needs.guard.outputs.deploy_ref }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH=(ssh
            -i ~/.ssh/deploy_key
            -p "$DEPLOY_SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          )

          # deploy.sh pulls origin/$DEPLOY_REF by default (single source of truth).
          # Historical --no-pull is only for when the VPS checkout is already at tip
          # and an operator skipped fetch; Actions always lets deploy.sh pull.
          set +e
          DEPLOY_LOG="$("${SSH[@]}" "set -euo pipefail
            cd ~/pikko
            ./scripts/deploy.sh --ref=${DEPLOY_REF} --public-smoke
            echo __PIKKO_DEPLOY_SHA__=\$(git rev-parse HEAD)
          " 2>&1)"
          DEPLOY_RC=$?
          set -e
          printf '%s\n' "$DEPLOY_LOG"

          DEPLOYED_SHA="$(printf '%s\n' "$DEPLOY_LOG" | sed -n 's/^__PIKKO_DEPLOY_SHA__=//p' | tail -1)"
          if [[ -z "$DEPLOYED_SHA" ]]; then
            DEPLOYED_SHA="$(printf '%s\n' "$DEPLOY_LOG" | sed -n 's/.*done sha=\([0-9a-f]*\).*/\1/p' | tail -1)"
          fi

          SMOKE_OK=false
          if printf '%s\n' "$DEPLOY_LOG" | grep -Eq '← smoke [0-9]+s$|smoke='; then
            if printf '%s\n' "$DEPLOY_LOG" | grep -Eq 'smoke .*FAILED|HEALTH CHECK FAILED'; then
              SMOKE_OK=false
            else
              SMOKE_OK=true
            fi
          fi
          if printf '%s\n' "$DEPLOY_LOG" | grep -q '← smoke .*FAILED'; then
            SMOKE_OK=false
          fi
          if (( DEPLOY_RC == 0 )) && printf '%s\n' "$DEPLOY_LOG" | grep -q 'done sha='; then
            SMOKE_OK=true
          fi
          if (( DEPLOY_RC != 0 )); then
            SMOKE_OK=false
          fi

          {
            echo "## Production deploy"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Requested ref | \`${DEPLOY_REF}\` |"
            echo "| Deployed SHA | \`${DEPLOYED_SHA:-unknown}\` |"
            echo "| Exit code | \`${DEPLOY_RC}\` |"
            echo "| Smoke / public-smoke | \`${SMOKE_OK}\` |"
            echo ""
            if (( DEPLOY_RC == 0 )); then
              echo "Deploy finished successfully."
            else
              echo "Deploy **failed**. See job logs for \`deploy.sh\` output."
            fi
            echo ""
            echo "<details><summary>Last 40 log lines</summary>"
            echo ""
            echo '```'
            printf '%s\n' "$DEPLOY_LOG" | tail -40
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          exit "$DEPLOY_RC"
